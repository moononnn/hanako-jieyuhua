<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- 球身径向渐变：左上偏白薄荷 → 中部主薄荷 → 右下深薄荷（更鲜明、有 3D 立体感） -->
    <radialGradient id="bodyGrad" cx="0.36" cy="0.28" r="0.88">
      <stop offset="0" stop-color="#dff0e4"/>
      <stop offset="0.20" stop-color="#a4dabb"/>
      <stop offset="0.55" stop-color="#73b698"/>
      <stop offset="1" stop-color="#3f7e63"/>
    </radialGradient>

    <!-- 外缘绒毛光晕：内外都淡，中间一道柔光带 -->
    <radialGradient id="haloGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.72" stop-color="#cde9d8" stop-opacity="0"/>
      <stop offset="0.83" stop-color="#cde9d8" stop-opacity="0.65"/>
      <stop offset="0.96" stop-color="#cde9d8" stop-opacity="0.14"/>
      <stop offset="1.00" stop-color="#cde9d8" stop-opacity="0"/>
    </radialGradient>

    <!-- 白色 brush 高光：椭圆带径向淡出 -->
    <radialGradient id="hlGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- 底部阴影暗带：让球有「坐在哪里」的立体感 -->
    <radialGradient id="bottomShade" cx="0.5" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#2e6350" stop-opacity="0.48"/>
      <stop offset="0.7" stop-color="#2e6350" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2e6350" stop-opacity="0"/>
    </radialGradient>

    <!-- 脸颊渐变：让腮红有"红扑扑"的层次 -->
    <radialGradient id="cheekGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5b5c4" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#ee9aae" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ee9aae" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. 外缘绒毛光晕（柔光带） -->
  <circle cx="200" cy="208" r="164" fill="url(#haloGrad)"/>

  <!-- 2. 球身主体 + 细线描边 -->
  <circle cx="200" cy="208" r="126" fill="url(#bodyGrad)" stroke="#3c7158" stroke-width="4"/>

  <!-- 3. 底部阴影暗带（叠在球身内，让球有下沉的立体感） -->
  <circle cx="200" cy="208" r="126" fill="url(#bottomShade)"/>

  <!-- 4. 上左白色 brush 高光（笔触感，对齐风铃那一条） -->
  <ellipse cx="156" cy="158" rx="30" ry="56" fill="url(#hlGrad)" transform="rotate(-22 156 158)"/>

  <!-- 5. 绒毛细微点缀：极淡极小的圆点，烘托毛绒感不抢戏 -->
  <g fill="#2e6350" opacity="0.42">
    <circle cx="94"  cy="182" r="2.4"/>
    <circle cx="103" cy="135" r="2.0"/>
    <circle cx="120" cy="100" r="1.6"/>
    <circle cx="146" cy="84"  r="1.8"/>
    <circle cx="178" cy="72"  r="1.7"/>
    <circle cx="218" cy="72"  r="1.8"/>
    <circle cx="252" cy="84"  r="1.7"/>
    <circle cx="280" cy="104" r="1.6"/>
    <circle cx="298" cy="138" r="2.0"/>
    <circle cx="308" cy="180" r="2.4"/>
    <circle cx="304" cy="222" r="2.0"/>
    <circle cx="293" cy="262" r="1.7"/>
    <circle cx="270" cy="298" r="1.8"/>
    <circle cx="238" cy="320" r="1.7"/>
    <circle cx="200" cy="332" r="1.7"/>
    <circle cx="162" cy="320" r="1.7"/>
    <circle cx="130" cy="298" r="1.8"/>
    <circle cx="106" cy="262" r="1.7"/>
    <circle cx="94"  cy="222" r="2.0"/>
  </g>

  <!-- 6. 眼睛（黑眼珠，椭圆略胖，符合可爱比例） -->
  <ellipse cx="168" cy="214" rx="16.5" ry="21" fill="#1f2c26"/>
  <ellipse cx="232" cy="214" rx="16.5" ry="21" fill="#1f2c26"/>

  <!-- 7. 眼睛主高光（左上，与左上白光同向） -->
  <circle cx="162" cy="206" r="6.5" fill="#ffffff"/>
  <circle cx="226" cy="206" r="6.5" fill="#ffffff"/>

  <!-- 8. 眼睛次反光（小一点，提亮"湿润感"） -->
  <circle cx="176" cy="222" r="3" fill="#ffffff" opacity="0.72"/>
  <circle cx="240" cy="222" r="3" fill="#ffffff" opacity="0.72"/>

  <!-- 9. 脸颊（带渐变的淡粉腮红 + 小高光） -->
  <ellipse cx="132" cy="240" rx="14" ry="8" fill="url(#cheekGrad)"/>
  <ellipse cx="268" cy="240" rx="14" ry="8" fill="url(#cheekGrad)"/>
  <ellipse cx="128" cy="235" rx="4" ry="2.2" fill="#ffffff" opacity="0.7"/>
  <ellipse cx="264" cy="235" rx="4" ry="2.2" fill="#ffffff" opacity="0.7"/>

  <!-- 10. 嘴巴（实心小弧月 + 圆点收尾，明显一点） -->
  <path d="M 190 244 Q 200 256 210 244" fill="none" stroke="#2c3e35" stroke-width="4" stroke-linecap="round"/>

  <!-- 11. 头顶小薄荷叶（明显一点） -->
  <g transform="translate(200 82) rotate(-12)">
    <path d="M 0 -24 Q -14 -10 -12 8 Q 0 16 12 8 Q 14 -10 0 -24 Z" fill="#73b698" stroke="#3c7158" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M 0 -18 L 0 8" stroke="#3c7158" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
    <path d="M -7 -10 Q -3 -2 -1 -3" fill="none" stroke="#3c7158" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
    <path d="M 7 -10 Q 3 -2 1 -3" fill="none" stroke="#3c7158" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>