<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320">
  <defs>
    <!-- 竹青（薄荷绿）圆柱渐变：暗-亮-暗，哑光温润 -->
    <linearGradient id="bambooCyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e9a84"/>
      <stop offset="0.2" stop-color="#7db8a2"/>
      <stop offset="0.5" stop-color="#8cbfae"/>
      <stop offset="0.8" stop-color="#7db8a2"/>
      <stop offset="1" stop-color="#5e9a84"/>
    </linearGradient>
  </defs>

  <!-- 圆柱主体（六片竹简密排） -->
  <path d="M60 70 Q60 64 66 64 L174 64 Q180 64 180 70 L180 290 Q180 296 174 296 L66 296 Q60 296 60 290 Z" fill="url(#bambooCyl)" stroke="#3f6b58" stroke-width="2"/>

  <!-- 顶部截面（卷起来的横截面，两圈） -->
  <ellipse cx="120" cy="66" rx="60" ry="12" fill="#4e8a72" stroke="#3f6b58" stroke-width="2"/>
  <ellipse cx="120" cy="66" rx="35" ry="7" fill="none" stroke="#35604e" stroke-width="1.4" opacity="0.7"/>
  <ellipse cx="120" cy="66" rx="14" ry="2.8" fill="none" stroke="#35604e" stroke-width="1.4" opacity="0.7"/>

  <!-- 底部截面 -->
  <ellipse cx="120" cy="293" rx="60" ry="11" fill="#4e8a72" stroke="#3f6b58" stroke-width="2"/>

  <!-- 竹片分隔线（6 片） -->
  <line x1="79" y1="70" x2="79" y2="290" stroke="#3f6b58" stroke-width="1.6" opacity="0.45"/>
  <line x1="99" y1="70" x2="99" y2="290" stroke="#3f6b58" stroke-width="1.6" opacity="0.45"/>
  <line x1="120" y1="70" x2="120" y2="290" stroke="#3f6b58" stroke-width="1.6" opacity="0.45"/>
  <line x1="141" y1="70" x2="141" y2="290" stroke="#3f6b58" stroke-width="1.6" opacity="0.45"/>
  <line x1="161" y1="70" x2="161" y2="290" stroke="#3f6b58" stroke-width="1.6" opacity="0.45"/>
</svg>
