<?xml version="1.0" encoding="UTF-8"?>
<!-- 解语花 · 落樱：单层手帐樱花
     保留清爽的五瓣轮廓，以樱花缺刻、柔和瓣脉和细花蕊增加小尺寸精致度。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="92 92 216 216" width="400" height="400">
  <defs>
    <linearGradient id="petalGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff7f6"/>
      <stop offset="0.58" stop-color="#f7d2dc"/>
      <stop offset="1" stop-color="#e995ad"/>
    </linearGradient>
    <radialGradient id="centerGrad" cx="0.34" cy="0.30" r="0.86">
      <stop offset="0" stop-color="#fff9d7"/>
      <stop offset="1" stop-color="#edc46f"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>

  <g id="flower" transform="translate(200 200)">
    <!-- 极淡的瓣根阴影，避免花心像贴上去的一颗圆点 -->
    <circle r="22" fill="#cf718e" opacity="0.18" filter="url(#softShadow)"/>

    <!-- 单层五瓣：轮廓略有手绘起伏，瓣尖保留樱花的小缺刻 -->
    <g fill="url(#petalGrad)" stroke="#745d65" stroke-width="3" stroke-linejoin="round">
      <g id="petal0" transform="rotate(0)">
        <path d="M 0 -8 C -27 -17 -39 -38 -36 -67 C -34 -86 -18 -96 -4 -84 L 0 -78 L 4 -84 C 18 -96 34 -86 36 -67 C 39 -38 27 -17 0 -8 Z"/>
        <path d="M 0 -16 C -5 -35 -5 -55 0 -72" fill="none" stroke="#fff9fa" stroke-width="3.2" stroke-linecap="round" opacity="0.58"/>
      </g>
      <g id="petal1" transform="rotate(72)">
        <path d="M 0 -8 C -27 -17 -39 -38 -36 -67 C -34 -86 -18 -96 -4 -84 L 0 -78 L 4 -84 C 18 -96 34 -86 36 -67 C 39 -38 27 -17 0 -8 Z"/>
        <path d="M 0 -16 C -5 -35 -5 -55 0 -72" fill="none" stroke="#fff9fa" stroke-width="3.2" stroke-linecap="round" opacity="0.58"/>
      </g>
      <g id="petal2" transform="rotate(144)">
        <path d="M 0 -8 C -27 -17 -39 -38 -36 -67 C -34 -86 -18 -96 -4 -84 L 0 -78 L 4 -84 C 18 -96 34 -86 36 -67 C 39 -38 27 -17 0 -8 Z"/>
        <path d="M 0 -16 C -5 -35 -5 -55 0 -72" fill="none" stroke="#fff9fa" stroke-width="3.2" stroke-linecap="round" opacity="0.58"/>
      </g>
      <g id="petal3" transform="rotate(216)">
        <path d="M 0 -8 C -27 -17 -39 -38 -36 -67 C -34 -86 -18 -96 -4 -84 L 0 -78 L 4 -84 C 18 -96 34 -86 36 -67 C 39 -38 27 -17 0 -8 Z"/>
        <path d="M 0 -16 C -5 -35 -5 -55 0 -72" fill="none" stroke="#fff9fa" stroke-width="3.2" stroke-linecap="round" opacity="0.58"/>
      </g>
      <g id="petal4" transform="rotate(288)">
        <path d="M 0 -8 C -27 -17 -39 -38 -36 -67 C -34 -86 -18 -96 -4 -84 L 0 -78 L 4 -84 C 18 -96 34 -86 36 -67 C 39 -38 27 -17 0 -8 Z"/>
        <path d="M 0 -16 C -5 -35 -5 -55 0 -72" fill="none" stroke="#fff9fa" stroke-width="3.2" stroke-linecap="round" opacity="0.58"/>
      </g>
    </g>

    <!-- 花蕊由长短两圈错开，小尺寸下仍看得出细节但不会糊成一团 -->
    <g id="stamens" stroke="#c7768f" stroke-width="2.2" stroke-linecap="round">
      <line x1="0" y1="-2" x2="0" y2="-22"/>
      <line x1="2" y1="-1" x2="17" y2="-14"/>
      <line x1="2" y1="1" x2="20" y2="7"/>
      <line x1="1" y1="2" x2="7" y2="20"/>
      <line x1="-1" y1="2" x2="-10" y2="18"/>
      <line x1="-2" y1="0" x2="-21" y2="-5"/>
      <line x1="-1" y1="-2" x2="-10" y2="-18"/>
    </g>
    <g id="anthers" fill="#dfa84f" stroke="#745d65" stroke-width="1.1">
      <circle cx="0" cy="-22" r="3.2"/>
      <circle cx="17" cy="-14" r="3.2"/>
      <circle cx="20" cy="7" r="3.2"/>
      <circle cx="7" cy="20" r="3.2"/>
      <circle cx="-10" cy="18" r="3.2"/>
      <circle cx="-21" cy="-5" r="3.2"/>
      <circle cx="-10" cy="-18" r="3.2"/>
    </g>

    <g id="core">
      <circle r="10" fill="url(#centerGrad)" stroke="#745d65" stroke-width="2.6"/>
      <ellipse cx="-3" cy="-3.5" rx="3" ry="1.8" fill="#ffffff" opacity="0.78"/>
    </g>
  </g>
</svg>
